name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Static analysis and tests
        run: just check

  coverage-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.13"
          python-version: "3.13"
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Tests with branch coverage
        run: just coverage
      - name: Coverage summary
        run: uv run --locked coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
      - name: Wheel carries the Pi extension
        run: just package-check
      - name: Build source distribution and wheel
        run: just build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
